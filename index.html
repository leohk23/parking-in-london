<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f6b4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Park Nearby" />
    <title>Park Nearby</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <h1><span class="logo" aria-hidden="true">P</span> Park Nearby <small>London</small></h1>
      <form id="search" autocomplete="off">
        <div class="row">
          <input id="q" name="q" type="search" placeholder="Postcode, street or place" aria-label="Destination" required />
          <button type="button" id="locate" class="secondary" title="Use my location" aria-label="Use my location">◎</button>
        </div>
        <div class="row options">
          <label>Arrive <input id="arrive" type="datetime-local" aria-describedby="arrive-hint" /></label>
          <label>Stay
            <select id="stay">
              <option value="30">30 min</option>
              <option value="60">1 hour</option>
              <option value="120" selected>2 hours</option>
              <option value="180">3 hours</option>
              <option value="240">4 hours</option>
              <option value="480">8 hours</option>
            </select>
          </label>
          <label>Within
            <select id="radius">
              <option value="250">250 m</option>
              <option value="500" selected>500 m</option>
              <option value="800">800 m</option>
            </select>
          </label>
          <button type="submit" id="go">Find parking</button>
        </div>
        <small id="arrive-hint" class="hint">Leave "Arrive" empty for now.</small>
      </form>
    </header>

    <main class="layout">
      <div id="map" aria-label="Map of parking options"></div>
      <section class="results" aria-live="polite">
        <div id="status" class="status">Search for where you're going to see nearby parking.</div>
        <div class="controls" hidden>
          <label><input type="checkbox" id="freeOnly" /> Free for my whole stay</label>
          <label>Sort
            <select id="sort">
              <option value="best">Free first</option>
              <option value="near">Nearest</option>
            </select>
          </label>
        </div>
        <ol id="list" class="list"></ol>
        <p class="disclaimer">
          Always check the signs on the street: they override anything shown here. Data from
          OpenStreetMap contributors, Camden Council open data and council zone pages (see each result).
        </p>
      </section>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
