name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to pick up changes to the councils' street lists.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a running Pages deployment finish; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Browsers can't read these councils' sites, so their street lists are
      # copied here. If a site is down, the copy in the repo is published instead.
      - name: Refresh council street lists
        run: |
          node scripts/update-wandsworth.mjs || echo "::warning::Kept the committed Wandsworth list"
          node scripts/update-kingston.mjs || echo "::warning::Kept the committed Kingston list"
      - uses: actions/configure-pages@v5
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest icons src data vendor _site/
          # Versioned URLs, so a phone never runs a mix of old and new files after a deploy.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|src/app\.js)\"#\1=\"\2?v=$v\"#" _site/index.html
          find _site/src _site/data -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']*\.js)'#\1?v=$v'#" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
