name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to pick up changes to the councils' street lists and maps, and OpenStreetMap.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a running Pages deployment finish; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Browsers can't read these councils' sites, so their street lists are
      # copied here. If a site is down, the copy in the repo is published instead.
      - name: Refresh council street lists
        run: |
          node scripts/update-wandsworth.mjs || echo "::warning::Kept the committed Wandsworth list"
          node scripts/update-kingston.mjs || echo "::warning::Kept the committed Kingston list"
      # OpenStreetMap's car parks, street parking and street shapes for London,
      # cut into small tiles so searches don't wait on the busy Overpass servers.
      # If this fails the site is published without them and the app uses Overpass.
      - name: Build OpenStreetMap tiles
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -sSfL -o "$RUNNER_TEMP/london.osm.pbf" https://download.geofabrik.de/europe/united-kingdom/england/greater-london-latest.osm.pbf
          osmium tags-filter "$RUNNER_TEMP/london.osm.pbf" nwr/amenity=parking w/highway -o "$RUNNER_TEMP/filtered.osm.pbf" --overwrite
          osmium export "$RUNNER_TEMP/filtered.osm.pbf" -f geojsonseq --add-unique-id=type_id -o "$RUNNER_TEMP/london.geojsonseq" --overwrite
          node scripts/build-osm-tiles.mjs "$RUNNER_TEMP/london.geojsonseq" data/osm
      # Harrow's, Enfield's, Redbridge's, Barking & Dagenham's and Waltham Forest's
      # yellow lines, bays and zone maps, which browsers can't read from the
      # councils' servers. A council whose server is down is left out this week.
      - name: Copy council kerbside maps
        continue-on-error: true
        run: node scripts/build-kerb-tiles.mjs data
      - uses: actions/configure-pages@v5
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html sw.js styles.css manifest.webmanifest icons src data vendor _site/
          # Versioned URLs, so a phone never runs a mix of old and new files after a deploy.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|src/app\.js)\"#\1=\"\2?v=$v\"#" _site/index.html
          find _site/src _site/data -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']*\.js)'#\1?v=$v'#" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
